name: Documentation

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages-${{ github.ref }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Required / Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-docs-${{ hashFiles('docs/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-docs-

      - name: Install pandoc
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Install documentation dependencies
        run: |
          pip install --upgrade pip
          pip install -r docs/requirements.txt

      - name: Build Sphinx documentation
        working-directory: docs
        run: make html SPHINXOPTS="-W --keep-going"

      - name: Verify API documentation was imported
        run: |
          python - <<'PYDOCS'
          from pathlib import Path
          for page, anchors in {
              "counting": ["counting.count_alleles.make_count_df", "counting.run_counting_cohort.run_count_cohort"],
              "analysis": ["analysis.as_analysis.get_imbalance"],
              "mapping": ["mapping.__main__.make_reads"],
          }.items():
              html = Path(f"docs/build/html/api/{page}.html").read_text()
              for anchor in anchors:
                  assert f'id="{anchor}"' in html, anchor
          PYDOCS

      - name: Upload artifact
        if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: docs/build/html

  deploy:
    name: Deploy documentation
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write  # Deploy the validated documentation artifact.
      id-token: write  # Authenticate the GitHub Pages deployment.
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
