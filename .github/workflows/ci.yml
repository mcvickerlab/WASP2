# WASP2 CI workflow
# Runs linting, Python tests (with Rust extension), and Rust tests
# Replaces the broken shared-workflow reference

name: CI

on:
  push:
    branches: [master, dev]
  pull_request:
    branches: [master, dev]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ===========================================================================
  # Lint Python source with ruff (fast, no Rust build needed)
  # ===========================================================================
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Install ruff
        run: uv pip install --system ruff

      - name: Ruff check
        run: ruff check src/ tests/

      - name: Ruff format check
        run: ruff format --check src/ tests/

      - name: Check release metadata
        run: python scripts/release_version.py --check

  # ===========================================================================
  # Python tests with Rust extension (matrix: Python 3.10-3.13)
  # ===========================================================================
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          - python-version: "3.11"
            minimum-dependencies: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # Runtime reference tests read the pinned pre-Rust archive commit.
          fetch-depth: 0

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhts-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev \
            libssl-dev \
            pkg-config \
            libclang-dev \
            samtools \
            bcftools \
            bedtools bwa

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7  # stable

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884  # v10.3.0

      - name: Create virtualenv and install dependencies
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install maturin
          maturin develop --release
          uv pip install -e ".[dev,plink,cyvcf2,export]"

      - name: Verify Rust extension loads
        run: |
          source .venv/bin/activate
          python -c "import wasp2_rust; print('wasp2_rust loaded:', wasp2_rust.__file__)"

      - name: Pin historical numerical reference for the full real ATAC matrix
        if: matrix.python-version == '3.11'
        run: uv pip install --python .venv/bin/python numpy==1.26.4 scipy==1.13.1

      - name: Run tests
        run: |
          source .venv/bin/activate
          pytest tests/ -v --tb=short --junitxml=test-results.xml -o junit_family=xunit1 \
            -m "not benchmark and not sanity" \
            --ignore=tests/benchmarks \
            --ignore=tests/sanity

      - name: Check minimum supported scientific dependencies
        if: matrix.minimum-dependencies == true
        run: |
          uv pip install --python .venv/bin/python "numpy==1.26.4" "pandas==1.5.3" "polars==1.0.0" "scipy==1.13.1"
          source .venv/bin/activate
          pytest tests/counting tests/analysis tests/test_rust_python_counting_parity.py -q --tb=short

      - name: Upload Python test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: pytest-${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn

  # ===========================================================================
  # Rust unit tests and clippy lints
  # ===========================================================================
  rust-test:
    name: Rust Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libhts-dev \
            libbz2-dev \
            liblzma-dev \
            zlib1g-dev \
            libssl-dev \
            pkg-config \
            libclang-dev

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@4be9e76fd7c4901c61fb841f559994984270fce7  # stable
        with:
          components: clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba  # v0.0.11

      - name: Configure sccache
        run: |
          echo "SCCACHE_GHA_ENABLED=true" >> $GITHUB_ENV
          echo "RUSTC_WRAPPER=sccache" >> $GITHUB_ENV

      - name: Run cargo test
        working-directory: rust
        run: PYO3_PYTHON=$(command -v python3) cargo test

      - name: Run clippy
        working-directory: rust
        run: PYO3_PYTHON=$(command -v python3) cargo clippy --all-targets -- -D warnings

      - name: Check Rust formatting
        working-directory: rust
        run: cargo fmt --check

  required:
    name: Required / Core
    if: always()
    needs: [lint, test, rust-test]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          TEST_RESULT: ${{ needs.test.result }}
          RUST_RESULT: ${{ needs.rust-test.result }}
        run: |
          test "$LINT_RESULT" = success
          test "$TEST_RESULT" = success
          test "$RUST_RESULT" = success
