name: Container CI

on:
  push:
    branches: [master, dev]
    paths: ["Dockerfile", ".dockerignore", "tests/shared_data/**", "rust/**", "src/**", "pyproject.toml", "scripts/container_smoke_test.sh", "scripts/check_sbom.py", ".github/workflows/docker.yml"]
  pull_request:
    branches: [master, dev]
    paths: ["Dockerfile", ".dockerignore", "tests/shared_data/**", "rust/**", "src/**", "pyproject.toml", "scripts/container_smoke_test.sh", "scripts/check_sbom.py", ".github/workflows/docker.yml"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Container ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, platform: linux/amd64}
          - {runner: ubuntu-24.04-arm, platform: linux/arm64}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392  # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3
      - name: Read package version
        id: version
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          with open("rust/Cargo.toml", "rb") as handle:
              print("value=" + tomllib.load(handle)["package"]["version"])
          PY
      - name: Build local test image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6
        with:
          context: .
          load: true
          platforms: ${{ matrix.platform }}
          tags: wasp2:ci
          build-args: |
            VERSION=${{ steps.version.outputs.value }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=container-${{ strategy.job-index }}
          cache-to: type=gha,mode=max,scope=container-${{ strategy.job-index }}
      - name: Smoke-test image
        env:
          PLATFORM: ${{ matrix.platform }}
          EXPECTED_VERSION: ${{ steps.version.outputs.value }}
          EXPECTED_REVISION: ${{ github.sha }}
        run: |
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' wasp2:ci)" = "$EXPECTED_VERSION"
          test "$(docker inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' wasp2:ci)" = "$EXPECTED_REVISION"
          docker run --rm --platform "$PLATFORM" -e EXPECTED_WASP2_VERSION="$EXPECTED_VERSION" wasp2:ci /opt/wasp2/scripts/container_smoke_test.sh
      - name: Build dependency image for scanning
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          target: rust-builder
          load: true
          platforms: ${{ matrix.platform }}
          tags: wasp2:builder-scan
          cache-from: type=gha,scope=container-${{ strategy.job-index }}
      - name: Scan build dependency vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1
        with:
          image-ref: wasp2:builder-scan
          version: v0.76.0
          format: json
          output: builder-vulnerabilities.json
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Preserve build dependency scan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: builder-scan-${{ strategy.job-index }}
          path: builder-vulnerabilities.json
          if-no-files-found: warn
      - name: Inventory runtime image
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: wasp2:ci
          format: cyclonedx-json
          output-file: container-sbom.cdx.json
          upload-artifact: false
      - name: Verify image inventory
        run: python3 scripts/check_sbom.py container-sbom.cdx.json wasp2 numpy scipy samtools bcftools bedtools
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container-sbom-${{ strategy.job-index }}
          path: container-sbom.cdx.json
          if-no-files-found: error
      - name: Scan runtime image vulnerabilities
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # 0.35.0
        with:
          image-ref: wasp2:ci
          format: json
          output: container-vulnerabilities.json
          version: v0.76.0
          severity: CRITICAL,HIGH
          exit-code: '1'
      - name: Preserve container scan
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: container-scan-${{ strategy.job-index }}
          path: container-vulnerabilities.json
          if-no-files-found: error

  required:
    name: Required / Container
    if: always()
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Verify container builds
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: test "$BUILD_RESULT" = success
