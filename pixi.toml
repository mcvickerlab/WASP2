# WASP2 - pixi environment configuration
# Install: curl -fsSL https://pixi.sh/install.sh | bash && pixi install
# Run: pixi run wasp2-count --help
#
# Pixi resolves Python, Rust, and external tools. The generated pixi.lock is
# local to the installation; this repository does not distribute a Pixi lock.

[workspace]
requires-pixi = ">=0.82.0"
name = "wasp2"
version = "1.5.0"
description = "Allele-specific analysis of next-generation sequencing data with Rust acceleration"
channels = ["conda-forge", "bioconda"]
platforms = ["linux-64", "linux-aarch64", "osx-arm64", "osx-64"]

# Recognize Bioconda distributions when resolving WASP2's PyPI requirements.
# This avoids a second provider overwriting the same installed Python files.
[workspace.conda-pypi-map]
bioconda = { mapping-mode = "overlay", mapping = { pysam = "pysam", pybedtools = "pybedtools", pgenlib = "pgenlib" } }

[dependencies]
# Core Python
python = ">=3.10,<3.14"

# Bioinformatics tools (resolved by conda)
samtools = ">=1.10"
bcftools = ">=1.10"
gsl = "==2.7"
bedtools = ">=2.30"
htslib = ">=1.10"
bwa = ">=0.7"

# Data processing
numpy = ">=1.21,<2.0"
pandas = ">=1.5,<3.0"
polars = ">=1.0,<2.0"
scipy = ">=1.13.1"
pysam = ">=0.21"
pybedtools = ">=0.9"
anndata = ">=0.8,<0.12"
scanpy = ">=1.10"
numba = ">=0.59"
pgenlib = ">=0.90"

# CLI
typer = ">=0.12"
rich = ">=13.0"

# Rust build toolchain
rust = ">=1.88"
cmake = ">=3.14"
libclang = ">=18,<20"
clang = ">=18,<20"
pkg-config = "*"

[target.osx-64.dependencies]
numba = ">=0.59,<0.63"

[pypi-dependencies]
wasp2 = { path = ".", editable = true }
maturin = ">=1.6,<2.0"

[feature.dev.dependencies]
pytest = ">=7.0"
pytest-cov = ">=4.0"
pytest-benchmark = ">=4.0"
mypy = ">=1.0"
ruff = ">=0.9"

[environments]
default = { solve-group = "default" }
dev = { features = ["dev"], solve-group = "default" }

[tasks]
# Quick verification
verify = "wasp2-count --help && wasp2-map --help && wasp2-analyze --help && python -c 'import wasp2_rust; print(\"OK\")'"
# Build Rust extension
build = "maturin develop --release -m rust/Cargo.toml"

[feature.dev.tasks]
# Run tests
test = "pytest tests/ -v --tb=short --ignore=tests/benchmarks -m 'not benchmark'"
test-mapping-parity = "pytest tests/mapping/ tests/regression/test_quickbench*.py -v --tb=short"
# Run benchmarks
bench = "pytest tests/benchmarks/ -v --tb=short"
# Lint
lint = "ruff check src/ tests/"
