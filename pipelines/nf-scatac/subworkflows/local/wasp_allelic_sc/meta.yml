name: wasp_allelic_sc
description: |
  Single-cell BAM allele counting or fragment overlap coverage.
  Fragment coverage is aggregated without allele inference; downstream
  BAM-to-inference aggregation is not implemented.
keywords:
  - wasp2
  - scatac
  - single-cell
  - allelic imbalance
  - fragments

components:
  - wasp2/vcf_to_bed
  - local/scatac_count_alleles

input:
  - ch_fragments:
      description: |
        Channel containing scATAC fragment files with tabix index.
        Structure: [ val(meta), path(fragments.tsv.gz), path(fragments.tbi) ]
  - ch_vcf:
      description: |
        Channel containing VCF file with heterozygous SNPs.
        Structure: [ val(meta), path(vcf), path(tbi) ]

output:
  - cell_counts:
      description: |
        Per-cell fragment overlap counts at heterozygous SNP positions.
        Note: These are overlap counts, not allele-specific counts.
        Structure: [ val(meta), path(counts.tsv) ]
  - imbalance:
      description: |
        Empty channel; this workflow does not run allelic imbalance inference.
        Structure: [ val(meta), path(results.tsv) ]
  - versions:
      description: |
        File containing software versions.
        Structure: [ path(versions.yml) ]

authors:
  - "@Jaureguy760"
maintainers:
  - "@Jaureguy760"
